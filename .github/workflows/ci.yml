name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webmcp:
    name: Website WebMCP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out the pinned Graft generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: himanshu748/graft-webmcp
          ref: 4c5b77c5386a020c40d248db948db562d4d7ebcf
          path: .graft-source
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.9.0"

      - name: Rebuild adapters from the pinned Graft source
        run: |
          npm ci --prefix .graft-source
          npm run build:runtime --prefix .graft-source
          rebuild_root="${RUNNER_TEMP}/graft-rebuild"
          cd .graft-source
          ./node_modules/.bin/vite-node scripts/build-adapter-from-html.ts \
            ../site/index.html \
            https://omnidev-flame.vercel.app/ \
            "${rebuild_root}/site/graft-adapter.js"
          ./node_modules/.bin/vite-node scripts/build-adapter-from-html.ts \
            ../site/agent-lab/index.html \
            https://omnidev-flame.vercel.app/agent-lab/ \
            "${rebuild_root}/site/agent-lab/graft-adapter.js" \
            --review ../site/agent-lab/graft-review.json
          cmp "${rebuild_root}/site/graft-adapter.js" ../site/graft-adapter.js
          cmp "${rebuild_root}/site/graft-adapter.js.sha256" ../site/graft-adapter.js.sha256
          cmp "${rebuild_root}/site/agent-lab/graft-adapter.js" ../site/agent-lab/graft-adapter.js
          cmp "${rebuild_root}/site/agent-lab/graft-adapter.js.sha256" ../site/agent-lab/graft-adapter.js.sha256

      - name: Verify generated adapter and provenance
        run: node scripts/check-webmcp.mjs

      - name: Verify Agent Review Room contract and approval boundary
        run: node scripts/check-agent-lab-webmcp.mjs

  backend:
    name: Backend (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # Lets the agent-sandbox tests exercise real bubblewrap confinement.
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - name: Install bubblewrap
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run tests
        run: pytest -q

  typecheck:
    name: Backend (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-typecheck.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.9.0"

      - name: Install hash-locked runtime and checker dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes -r backend/requirements.lock -r backend/requirements-typecheck.lock

      - name: Check safety-critical services in strict mode
        run: make typecheck

      - name: Report the whole-app basic-mode baseline
        if: ${{ !cancelled() }}
        run: |
          set +e
          make typecheck-all
          baseline_status=$?
          set -e
          printf 'Whole-app basic-mode baseline exit: %s (informational)\n' "$baseline_status"

  backend-macos:
    name: Backend (macOS Vision OCR)
    runs-on: macos-15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (including native Vision and Quartz)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run backend suite including real on-device OCR indexing
        run: pytest -q

  macos:
    name: macOS app (swift build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Swift package
        run: swift build -c release

      - name: Code Gen preview network isolation (real WKWebView)
        working-directory: .
        run: scripts/macos/check-preview-isolation.sh

  agent-sandbox-macos:
    name: Agent sandbox (macOS Seatbelt)
    runs-on: macos-15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      # Real Seatbelt confinement: writes, secrets, git hooks, network, and an
      # offline swift build inside the sandbox.
      - name: Run sandbox and agent tests
        run: pytest -q -rs tests/test_command_sandbox.py tests/test_agent.py
